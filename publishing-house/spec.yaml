# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "redhat-ai-inference"
  owner_email: "tasmith@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "both"
  description: "A hands-on workshop experience taking attendees through the full inference lifecycle from model selection to large scale deployment."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1180"
  workflow_id: "5e859ef1-f24e-48ca-aa2b-7a4967ee08e3"

spec:
  title: "From Model to Model as a Service: Building Scalable AI Inference"
  learning_objectives:
    - "Deploy a model for inference on Red Hat AI Enterprise"
    - "Analyze model inference performance using EvalHub for evaluations"
    - "Configure a repeatable evaluation workflow for tracking model performance over time"
    - "Configure a deployed model as a Model-as-a-Service for shared, scalable consumption"
    - "Integrate a model service into an application using standard API patterns"
    - "Verify end-to-end request flow from application request to model response"
    - "Monitor model serving metrics through the observability dashboard"
  modules:
    - id: module-01
      title: "Deploy a Model on Red Hat AI Enterprise"
      duration_min: 10
      status: draft_complete
    - id: module-02
      title: "Evaluate and Benchmark Model Performance with EvalHub"
      duration_min: 20
      status: draft_complete
    - id: module-03
      title: "Expose the Model as a Model-as-a-Service"
      duration_min: 20
      status: draft_complete
    - id: module-04
      title: "Integrate the Model into an Application"
      duration_min: 20
      status: draft_complete
    - id: module-05
      title: "Validate the End-to-End Workflow"
      duration_min: 20
      status: draft_complete
    - id: module-06
      title: "Monitor Model Performance through Observability"
      duration_min: 20
      status: draft_complete
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: aws        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.22"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "sno"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: 1    # 1 if sno, 3 if multinode
    control_plane_cpu: 64              # 32 if sno, 16 if multinode 
    # Need m6a.16xlarge due to api timeout issues.
    control_plane_ram_gb: 256           # 128 if sno, 64 if multinode
    worker_count: 0                    # number of OCP worker nodes
                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "gpu"              # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "NVIDIA-Nemotron-Nano-9B-v2-FP8-dynamic"  # validated modelcar: rhelai1/modelcar-nvidia-nemotron-nano-9b-v2-fp8-dynamic:1.5
    ai_justification: "Attendees deploy and serve a model on-cluster for inference, requiring dedicated GPU resources."
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:                 # named external service dependencies e.g. [github.com]
      - "registry.redhat.io"
      - "quay.io"
    gpu_nodes: 1                       # number of GPU nodes (0 = none)
    gpu_type: "g6.2xlarge"             # L4 24 GB — fits the Nemotron Nano 9B v2 FP8-dynamic model (11.6 GB VRAM, l4-gpu toleration); was g6e.12xlarge (L40S 48GB, sized for the 30B model)
  duration_hours: 2
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    gitops:
      status: draft_complete
  e2e:
    status: draft_complete
  healthCheck:
    status: draft_complete

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "Covers the explicit lifecycle progression from individual model deployment through EvalHub-based evaluation to shared Model-as-a-Service — no existing catalog item covers EvalHub or this end-to-end inference lifecycle arc."
    design_overview: "This lab targets AI engineers, platform engineers, and AI operations teams who need to move beyond model deployment into production-grade serving. Attendees take a model through the full inference lifecycle on Red Hat AI Enterprise — from deployment and EvalHub evaluation through Model-as-a-Service exposure, application integration, and observability."
    module_summaries:
      - title: "Deploy a Model on Red Hat AI Enterprise"
        overview: "Attendees deploy a model for inference on Red Hat AI Enterprise, configuring the model server and verifying it accepts requests."
      - title: "Evaluate and Benchmark Model Performance with EvalHub"
        overview: "Attendees use EvalHub to benchmark the deployed model's inference performance and configure a repeatable evaluation workflow for tracking changes over time."
      - title: "Expose the Model as a Model-as-a-Service"
        overview: "Attendees configure the deployed model as a shared Model-as-a-Service with access controls, API endpoints, and scaling policies."
      - title: "Integrate the Model into an Application"
        overview: "Attendees connect a sample application to the MaaS endpoint using standard API patterns and observe inference responses flowing through the integration."
      - title: "Validate the End-to-End Workflow"
        overview: "Attendees trace a request from application through MaaS to model, troubleshoot a simulated failure, and confirm end-to-end reliability."
      - title: "Monitor Model Performance through Observability"
        overview: "Attendees explore the observability dashboard, monitor serving metrics under load, and analyze performance trends that inform scaling decisions."
    rcars_overlap_pct: 90
    rcars_top_matches:
      - title: "Private Model as a Service - A Practical Guide to Red Hat AI"
