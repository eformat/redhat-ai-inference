# Dashboard CR perses fix (module 6 — /perses proxy; upstream
# opendatahub-io/opendatahub-operator#3910: without spec.observability the
# dashboard-operator never deploys the /perses proxy and requests to
# /perses/api/* fall through to the SPA index.html).
#
# RHOAI 3.6-ea2: the Dashboard CR moved to the components.platform group and is
# CLUSTER-SCOPED (no namespace). PARTIAL CR, applied with ServerSideApply so
# ArgoCD owns ONLY spec.observability — the operator keeps managing the rest of
# the spec it generated (gateway.domain is operator-set and cluster-specific).
apiVersion: components.platform.opendatahub.io/v1alpha1
kind: Dashboard
metadata:
  name: default-dashboard
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  observability:
    enabled: true
    persesService:
      name: data-science-perses
      namespace: redhat-ods-monitoring
      port: 8080
