# Dev Spaces instance (module 4 — "Open the application in Dev Spaces").
# Field names aligned with the 3.6-ea2 CheCluster CRD (v3.30.2 operator):
# components.database, components.imageRegistry, devEnvironments.disableContainerRegistryCapabilities,
# maxNumberOfWorkspacesPerUser and startTimeoutSec were dropped/renamed by the
# ea2 schema — the operator manages those (and adds devfileRegistry, imagePuller,
# openVSXRegistry, dashboard.logLevel, networking.auth.gateway itself).
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
    devWorkspace: {}
    dashboard: {}
    metrics: {}
    pluginRegistry: {}
    # Module 4 — the learner devfile registry. Served from the workshop repo
    # itself (raw.githubusercontent.com, cluster-agnostic; the files live in
    # automation/gitops/devfile-registry-v3/ — the suffix bumps bust the raw
    # CDN's stale cache, which lags pushes by many minutes on this path).
    # The sample appears on the Dev Spaces Create Workspace page.
    devfileRegistry:
      externalDevfileRegistries:
        - url: https://raw.githubusercontent.com/rhpds/redhat-ai-inference/main/automation/gitops/devfile-registry-v3
  devEnvironments:
    containerBuildConfiguration:
      openShiftSecurityContextConstraint: devworkspace-controller
    defaultComponents: []
    defaultEditor: che-incubator/che-code/latest
    maxNumberOfRunningWorkspacesPerUser: -1
    secondsOfInactivityBeforeIdling: 1800
  networking:
    auth: {}
