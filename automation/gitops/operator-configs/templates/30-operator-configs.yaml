---
apiVersion: operator.openshift.io/v1
kind: LeaderWorkerSetOperator
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  logLevel: Normal
  managementState: Managed
  operatorLogLevel: Normal
status: {}
---
apiVersion: operator.openshift.io/v1
kind: JobSetOperator
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  logLevel: Normal
  operatorLogLevel: Normal
---
kind: Kueue
apiVersion: kueue.openshift.io/v1
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  config:
    integrations:
      frameworks:
        - BatchJob
        - Deployment
        - Pod
        - PyTorchJob
        - RayCluster
        - RayJob
        - StatefulSet
        - TrainJob
    preemption:
      preemptionPolicy: Classical
  logLevel: Normal
  managementState: Managed
  operatorLogLevel: Normal