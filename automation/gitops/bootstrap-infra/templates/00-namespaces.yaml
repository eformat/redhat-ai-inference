# Operator namespaces. All carry the cluster-monitoring label so the
# platform metrics/prometheus scrape them (pool olm chart pattern).
---
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    openshift.io/cluster-monitoring: "true"
---
