---
# KServe inference gateway (module 1 — LLMInferenceService deployments).
#
# RHOAI 3.6-ea2: the KServe controller's managed HTTPRoute for every
# LLMInferenceService references the Gateway openshift-ingress/
# openshift-ai-inference by default — without it the deployment sits
# RefsInvalid ("Managed HTTPRoute references non-existent Gateway
# openshift-ingress/openshift-ai-inference") and the model's external route
# never comes up.
#
# Shape mirrors the verified pool gateway policy (rhoai-cluster-pool
# policy-collection policy-gateway.yaml) and the DSC aigateway component's
# data-science-gateway: GatewayClass + Gateway on the OpenShift gateway
# controller (openshift.io/gateway-controller/v1), https listener with
# allowedRoutes from All so HTTPRoutes from any student project namespace can
# attach, and the serving-cert ConfigMap pattern (infrastructure.parametersRef)
# so the gateway Service gets a platform-issued TLS secret.
#
# Wave 2: same wave as the other gateways; the OpenShift gateway controller is
# platform-level so no CRD wait is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshift-ai-inference
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  controllerName: openshift.io/gateway-controller/v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-ai-inference-config
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
data:
  # Service parameters the gateway controller renders from the Gateway's
  # infrastructure.parametersRef. The serving-cert annotation makes the
  # service-ca operator issue the gateway Service a TLS secret.
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "openshift-ai-inference-service-tls"
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
    opendatahub.io/managed: "false"
  labels:
    app.kubernetes.io/name: openshift-ai-inference
    app.kubernetes.io/instance: openshift-ai-inference
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: openshift-ai-inference
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: openshift-ai-inference-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        # Model HTTPRoutes from any student project namespace attach here
        # (the KServe controller's managed route targets this gateway).
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: openshift-ai-inference-service-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-gateway-setup
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-gateway-status
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    resourceNames: ["openshift-ai-inference"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    resourceNames: ["cluster"]
    verbs: ["get"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    resourceNames: ["inference-gateway-route"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create"]
  # OpenShift gates spec.host on a Route behind the routes/custom-host
  # subresource — plain routes/create gives "Forbidden: you do not have
  # permission to set the host field of the route" (the maas-gateway
  # precedent). NOTE: no resourceNames — the RouteHost admission plugin
  # authorizes routes/custom-host WITHOUT a resourceName, so RBAC cannot
  # scope this grant to a single route. Acceptable: the ClusterRole binds
  # only the workshop's inference-gateway-setup hook SA.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-gateway-status
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inference-gateway-status
subjects:
  - kind: ServiceAccount
    name: inference-gateway-setup
    namespace: redhat-ods-applications
---
# Patches the gateway's https listener hostname with the external hostname
# (inference-gateway.<apps-domain>, e.g. inference-gateway.apps.<cluster-domain>),
# and creates the external Route fronting the gateway Service, so the KServe
# controller's managed HTTPRoute — which carries no hostname — resolves to an
# external URL and the model gets a reachable *.apps route.
#
# WHY A JOB AND NOT A MANIFEST: the hostname is cluster-specific — a static
# chart listener would need the apps domain value in git; the Job reads the
# domain live from ingress.config/cluster instead, so the chart is portable
# across repos/clusters (the maas-gateway-status precedent, same domain
# convention: the ingress.config value already carries the "apps" prefix).
# ArgoCD does not track hook-created resources; BeforeHookCreation re-runs
# the Job on every sync, and the Job re-applies the hostname after each chart
# re-apply (the chart's Gateway has no hostname, so the sync briefly clears
# it — the Job at wave 3, after the Gateway at wave 2, restores it).
#
# Idempotent (same values); BeforeHookCreation re-runs on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-gateway-status
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: inference-gateway-setup
      restartPolicy: OnFailure
      containers:
        - name: status
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Apps domain read live from the cluster — the chart carries no
              # cluster-specific values (portable across repos/clusters).
              # NOTE: the ingress.config domain ALREADY includes the "apps"
              # prefix (e.g. apps.<cluster-domain>), so the hostname is
              # inference-gateway.<domain> — no extra "apps." segment.
              DOMAIN="$(oc get ingress.config cluster -o jsonpath='{.spec.domain}')"
              HOST="inference-gateway.${DOMAIN}"
              until oc -n openshift-ingress get gateway openshift-ai-inference >/dev/null 2>&1; do
                echo "waiting for the gateway"; sleep 10
              done
              # Listener patch — the https listener gets the external hostname;
              # the KServe managed HTTPRoute (no hostname of its own) then
              # resolves to an external URL on this host.
              oc -n openshift-ingress patch gateway openshift-ai-inference --type=merge -p "{\"spec\":{\"listeners\":[{\"name\":\"https\",\"port\":443,\"protocol\":\"HTTPS\",\"allowedRoutes\":{\"namespaces\":{\"from\":\"All\"}},\"hostname\":\"${HOST}\",\"tls\":{\"mode\":\"Terminate\",\"certificateRefs\":[{\"group\":\"\",\"kind\":\"Secret\",\"name\":\"openshift-ai-inference-service-tls\"}]}}]}}"
              echo "gateway listener hostname patched with ${HOST}"
              # External Route fronting the gateway Service (created here, not
              # in the chart: the host is cluster-specific — the maas-gateway
              # pattern). Without it the router has no backend for the
              # listener hostname and the external URL returns 503.
              # oc apply is idempotent and updates the host if the domain
              # ever changes.
              cat <<ROUTE | oc -n openshift-ingress apply -f -
              apiVersion: route.openshift.io/v1
              kind: Route
              metadata:
                name: inference-gateway-route
                labels:
                  gateway.networking.k8s.io/gateway-name: openshift-ai-inference
              spec:
                host: "${HOST}"
                to:
                  kind: Service
                  name: openshift-ai-inference-openshift-ai-inference
                  weight: 100
                port:
                  targetPort: https
                tls:
                  termination: reencrypt
                  insecureEdgeTerminationPolicy: Redirect
              ROUTE
              echo "Route inference-gateway-route applied with host ${HOST}"
