# Dev Spaces instance (module 4 — "Open the application in Dev Spaces").
# CheCluster from the workshop-apps devspaces.yaml used on prelude2.
# NOTE: the CheCluster's database.credentialsSecretName (postgres-credentials)
# is auto-generated by the Dev Spaces operator in openshift-devspaces — it is
# a different secret from the MaaS postgres-creds in redhat-ods-applications.
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
    database:
      credentialsSecretName: postgres-credentials
      pvc: {}
    devWorkspace: {}
    dashboard: {}
    imageRegistry: {}
    metrics: {}
    pluginRegistry: {}
  devEnvironments:
    containerBuildConfiguration:
      openShiftSecurityContextConstraint: devworkspace-controller
    defaultComponents: []
    defaultEditor: che-incubator/che-code/latest
    disableContainerRegistryCapabilities: false
    maxNumberOfRunningWorkspacesPerUser: -1
    maxNumberOfWorkspacesPerUser: -1
    secondsOfInactivityBeforeIdling: 1800
    startTimeoutSec: 300
  networking:
    auth: {}
