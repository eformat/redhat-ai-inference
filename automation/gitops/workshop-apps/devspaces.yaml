# Module 4 — Dev Spaces operator + instance, for the "Open the application
# in Dev Spaces" step and screenshots 401/402/405/406.
# The stable-channel CSV (devspacesoperator.v3.30.2) supports AllNamespaces
# only, so the OperatorGroup targets the whole cluster (spec: {}).
# Install docs: create the openshift-devspaces project + the CheCluster CR
# named `devspaces` (the web-console flow, scripted here).
# NOTE: applied manually with `oc apply -f` — NOT `oc apply -k` (the dir's
# maas-credentials-secret.yaml is a placeholder template that must not
# overwrite the live secret). See README.md.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-devspaces
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: devspaces-operator-group
  namespace: openshift-devspaces
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  channel: stable
  installPlanApproval: Automatic
  name: devspaces
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
    database:
      credentialsSecretName: postgres-credentials
      pvc: {}
    devWorkspace: {}
    dashboard: {}
    imageRegistry: {}
    metrics: {}
    pluginRegistry: {}
  devEnvironments:
    containerBuildConfiguration:
      openShiftSecurityContextConstraint: devworkspace-controller
    defaultComponents: []
    defaultEditor: che-incubator/che-code/latest
    disableContainerRegistryCapabilities: false
    maxNumberOfRunningWorkspacesPerUser: -1
    maxNumberOfWorkspacesPerUser: -1
    secondsOfInactivityBeforeIdling: 1800
    startTimeoutSec: 300
  networking:
    auth: {}
