# Module 6 — observability stack dependencies, for the "Observe & monitor →
# Dashboard" step and screenshots 601/604/605/606.
#
# Root cause fixed on the QA cluster 2026-10-25 (three layers):
# 1. DSCI spec.monitoring was already Managed, but the RHOAI operator refuses
#    to deploy the monitoring stack until three OperatorHub operators are
#    installed — DSCI reports MonitoringDependenciesReady=False/MissingOperator
#    and redhat-ods-monitoring stays empty ("Unable to reach observability
#    dashboards" on the RHOAI dashboard Observe & monitor pages):
#      * Red Hat build of OpenTelemetry (opentelemetry-product) — metrics, traces, usage logs
#      * Cluster Observability Operator (cluster-observability-operator) — dashboards + metrics storage
#      * Tempo Operator (tempo-product) — traces
# 2. The Dashboard CR (default-dashboard) has no spec.observability field, so
#    the dashboard-operator never deploys the /perses proxy and requests to
#    /perses/api/* fall through to the SPA index.html ("Unexpected token '<'",
#    upstream opendatahub-io/opendatahub-operator#3910). The RHOAI operator's
#    deployment apply is itself broken on 3.6.0-ea.2 (its desired
#    MODULE_FEDERATION_CONFIG env has both value and valueFrom → the apply is
#    rejected, so it can never fix the proxy itself). Workaround applied live:
#    the operator's own federation-config ConfigMap (redhat-ods-applications,
#    key module-federation-config.json) was updated with a perses proxyService
#    entry and the rhods-dashboard Deployment env switched to valueFrom
#    (the upstream ODH template shape). The equivalent Dashboard CR patch is:
#      oc patch dashboard default-dashboard -n redhat-ods-applications \
#        --type merge -p '{"spec":{"observability":{"enabled":true,
#        "persesService":{"name":"data-science-perses",
#        "namespace":"redhat-ods-monitoring","port":8080}}}}'
#    (NOT included as a kustomize resource here — the Dashboard CR is
#    operator-managed; a full-CR apply would clobber its other spec fields.)
# 3. The RHOAI Monitoring CR's perses-operator-access NetworkPolicy only allows
#    ingress from the openshift-cluster-observability-operator namespace, but
#    the COO (and its perses-operator) run in redhat-ods-operator here — so the
#    perses-operator could not sync the Perses dashboards/datasources into
#    perses (context deadline exceeded, Perses showed "No dashboards were
#    found"). The NetworkPolicy below adds the missing allow rule; the
#    PersesDatasource gives the applications-project usage dashboard its
#    datasource (the dashboard references it by name in its own project).
#
# The subscriptions live in redhat-ods-operator (the AllNamespaces
# rhods-operator OperatorGroup is already there — owned by the
# rhoai-cluster-pool GitOps, which also owns DSCI/DSC; do NOT duplicate those
# here). Everything is stable-channel and safe to leave installed.
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: redhat-ods-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: redhat-ods-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: opentelemetry-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: tempo-product
  namespace: redhat-ods-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: tempo-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# Allow the perses-operator (deployed by the COO into redhat-ods-operator) to
# reach the perses API so it syncs dashboards and datasources. The RHOAI
# Monitoring CR only whitelists openshift-cluster-observability-operator, which
# is not where the COO runs on this cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perses-operator-redhat-ods-operator-access
  namespace: redhat-ods-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: perses-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-operator
          podSelector:
            matchLabels:
              app.kubernetes.io/name: perses-operator
      ports:
        - port: 8080
          protocol: TCP
---
# The Usage dashboard shipped into redhat-ods-applications references its
# datasource by name in its own project; the RHOAI operator only creates the
# PersesDatasource in redhat-ods-monitoring. Mirror it so the Usage tab's
# overview cards and token consumption panels resolve it.
apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: data-science-prometheus-datasource
  namespace: redhat-ods-applications
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  config:
    default: false
    display:
      description: Data Science MonitoringStack Thanos Querier - provides DS workload metrics
      name: Data Science Prometheus
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://thanos-querier-data-science-thanos-querier.redhat-ods-monitoring.svc.cluster.local:10902
