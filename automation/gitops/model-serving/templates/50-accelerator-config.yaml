---
# Custom accelerator config for the LLM deploy wizard (module 1).
#
# RHOAI 3.6-ea2: the platform-shipped LLMInferenceServiceConfig presets carry
# ONLY the vLLM image with EMPTY resources and NO tolerations, and both
# alternative delivery paths for the GPU node toleration are blocked:
#   - Kueue ResourceFlavor taints are stripped by the RHOAI operator's queue
#     management (autoCreateQueues) back to empty,
#   - HardwareProfile scheduling.node.tolerations are rejected by the CRD's
#     CEL validation ("When schedulingType is 'Queue' ... the 'node' field
#     must not be set").
# This config appears in the wizard's Accelerator configuration dropdown
# (opendatahub.io/config-type=accelerator label) and delivers the GPU node
# toleration through its template when selected — the wizard merges it into
# the created LLMInferenceServiceConfig via baseRefs.
#
# The NVIDIA GPU operator taints GPU nodes (nvidia.com/gpu=l4-gpu:NoSchedule)
# and re-applies the taint if it is removed from the node.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: vllm-nvidia-gpu-single-node
  namespace: redhat-ods-applications
  annotations:
    openshift.io/display-name: vLLM NVIDIA GPU Single Node
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/supported-topologies: '["workload-single-node"]'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  labels:
    opendatahub.io/config-type: accelerator
    platform.opendatahub.io/part-of: kserve
spec:
  template:
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
        value: l4-gpu
