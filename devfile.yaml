schemaVersion: 2.2.0
metadata:
  name: maas-chat-client
  displayName: "Module 4: MaaS Chat Client"
  description: "Python workspace pre-loaded with the maas-chat-client sample application for Module 4 of the Red Hat AI Inference workshop."
attributes:
  che-code.eclipse.org/vscode-preferences:
    security.workspace.trust.enabled: false
components:
  - name: maas-client-tools
    container:
      # Same image family as the lab terminal: python3, oc, curl, git, jq.
      # Lean (~1/3 of universal-developer-image) so workspace starts do not
      # fill node ephemeral storage.
      image: quay.io/rhpds/openshowroom-terminal-ocp:2026-03-11
      memoryLimit: 2Gi
      memoryRequest: 512Mi
      cpuRequest: 500m
      mountSources: true
      sourceMapping: /projects
projects:
  - name: redhat-ai-inference
    git:
      remotes:
        origin: https://github.com/rhpds/redhat-ai-inference.git
      checkoutFrom:
        revision: main
