schemaVersion: 2.2.0
metadata:
  name: maas-chat-client
  displayName: "Module 4: MaaS Chat Client"
  description: "Python workspace pre-loaded with the maas-chat-client sample application for Module 4 of the Red Hat AI Inference workshop. Install the oc CLI with the setup command in Module 4 Exercise 1."
attributes:
  che-code.eclipse.org/vscode-preferences:
    security.workspace.trust.enabled: false
components:
  - name: maas-client-tools
    container:
      # Verified anonymously-pullable (quay.io/rhpds/openshowroom-terminal-ocp
      # went private). Lean and already cached on the workshop nodes.
      image: registry.access.redhat.com/ubi9/python-311:latest
      memoryLimit: 2Gi
      memoryRequest: 512Mi
      cpuRequest: 500m
      mountSources: true
      sourceMapping: /projects
projects:
  - name: redhat-ai-inference
    git:
      remotes:
        origin: https://github.com/rhpds/redhat-ai-inference.git
      checkoutFrom:
        revision: main
