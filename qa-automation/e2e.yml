---
# ============================================================================
# E2E — End-to-end lab validation test
# ============================================================================
#
# Purpose:
#   Replays the automatable student flow from Modules 1-6 on a fresh cluster.
#   Acts as the automated "solve" — if this passes, the lab works end to end.
#   Console/UI-only steps (dashboard wizard, dashboard evaluation form,
#   Gen AI studio views, Dev Spaces interaction, VS Code Chat) are NOT
#   automated here — they are covered by the manual checklists in
#   qa/runs/redhat-ai-inference/ and noted below where they are skipped.
#
# Idempotent:
#   Safe to re-run on a cluster where a previous run partially or fully
#   completed. The project and ServiceAccount are created if missing, the
#   LLMInferenceService / MaaSModelRef / ConfigMap / Secret / Deployment are
#   applied (no-op when unchanged), the MaaSModelRef is only created when not
#   already published, and the API key is minted with a unique name. The
#   model token and MaaS API key are minted fresh per run with a 1h expiry —
#   ephemeral, non-destructive. Namespace labels and the LLMInferenceService
#   kueue.x-k8s.io/queue-name label are idempotent (--overwrite / apply).
#
# Scope:
#   - Preflight (M0): chart-provided platform signals (rhods CSV, DSC, MaaS
#     gateway, Kueue ClusterQueue, accelerator config, MaaS tier) — all
#     GitOps-managed by the app-of-apps charts (automation/gitops/) and
#     synced by ArgoCD; this playbook never applies platform resources
#   - Module 1: Deploy the GPT-OSS 20B (essential variant) LLMInferenceService
#     (KServe/vLLM, 1xGPU, Kueue-managed) and verify the serving endpoint
#   - Module 2: EvalHub benchmark evaluation via the evalhub CLI (the
#     verified module-02 Ex 1 + Ex 2 + Ex 4 shape: CLI config, model-auth
#     secret, arc_easy + truthfulqa_mc1 with the tokenizer param, results
#     + MLflow tracking, and the repeatable config-file run). The dashboard
#     evaluation form (Ex 3) is UI-only — manual checklist
#   - Module 3: Verify MaaS publication (MaaSModelRef, chart-provided
#     maas-free-subscription tier), the MaaS gateway, inference through the
#     gateway with an API key, and Kueue quota gating (scale to 2 → the
#     second replica stays SchedulingGated → scale back)
#   - Module 4: Deploy the maas-chat-client app (ConfigMap + Deployment) and
#     exercise the request loop via oc exec
#   - Module 5: Component verification (model server + gateway + app healthy),
#     the model server metrics scrape (vLLM series), and the credential-
#     failure negative test (revoke the app's API key via the MaaS API →
#     the app fails 403 → mint a new key and restore)
#   - Module 6: User workload monitoring and observability dashboard checks,
#     including the vLLM series check via the UWM Prometheus federate API
#
# When to run:
#   - After lab content changes to verify instructions still work
#   - On a FRESH QA cluster (healthcheck.yml should pass first)
#   - Via ZT Runner: /stream/qa/e2e
#   - Or manually: ansible-playbook qa-automation/e2e.yml
#
# Prerequisites:
#   - Fresh cluster with RHOAI 3.6-ea2 + MaaS enabled + GPU node
#     (healthcheck.yml passes first)
#   - The app-of-apps charts (automation/gitops/) synced by ArgoCD — the M0
#     preflight verifies the chart-provided signals before Module 1
#   - oc logged in with credentials that can manage the student project
#   - jq installed (used to parse MaaS API responses)
#   - Model and serving images pre-pulled (RAC risk mitigation — keeps the
#     Module 1 cold start inside the retry window; on a cluster where they
#     are NOT pre-pulled, the Module 1 polling retries are sized for it)
#
# Runtime:
#   ~20-30 minutes first run (vLLM engine init dominates; ~30-40 when the
#   model and serving images are not pre-pulled — image pulls dominate)
#   ~5 minutes on re-run (most steps are no-ops, only verify tasks run)
#
# How manifests are accessed:
#   Self-contained — no git clone. Students deploy via the dashboard wizard
#   (Module 1) and Dev Spaces (Module 4), so the equivalent manifests are
#   inlined here from the module content: the LLMInferenceService (Module 1),
#   the MaaSModelRef (Module 3), and the client code + Deployment (Module 4).
#
# Retry strategy:
#   Model cold start, MaaS publication, and app rollout are async. Tasks
#   that depend on them use `until` + `retries` + `delay` to poll for
#   readiness. Typical: 10-20 retries at 10-30s intervals = 2-10 min max
#   wait per step.
#   NOTE: Ansible prints "FAILED - RETRYING" during polling — this is normal
#   behavior, NOT an error. A real failure shows "fatal:" in the output.
#
# Adding modules for your lab:
#   1. Group tasks by module with a clear section header comment
#   2. Name every task with the module prefix: "M<N> | <description>"
#   3. End each module section with a VERIFY task that checks the outcome
#   4. Use kubernetes.core.k8s with inline definitions (idempotent apply)
#   5. Use `changed_when: true` for apply/create tasks
#   6. Use `changed_when: false` for read-only tasks (get, wait, exec, whoami)
#   7. Add retries for any task that depends on async reconciliation
#   8. For idempotency: check if a resource exists before creating it
# ============================================================================

- name: End-to-End Test
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
  environment:
    KUBECONFIG: "{{ k8s_kubeconfig | default(omit) }}"
    K8S_AUTH_KUBECONFIG: "{{ k8s_kubeconfig | default(omit) }}"
  vars:
    # -- Platform (M0 preflight) ----------------------------------------------
    # Chart-provided accelerator config the Module 1 deploy wizard selects
    # (model-serving chart, 50-accelerator-config.yaml).
    accel_config_name: vllm-nvidia-gpu-single-node
    accel_config_namespace: redhat-ods-applications
    # -- Model (Module 1 — carries forward unchanged through Modules 2-6) ---
    model_name: redhataigpt-oss-20b-essential
    llis_api_version: serving.kserve.io/v1alpha2
    modelcar_image: oci://registry.redhat.io/rhai/modelcar-gpt-oss-20b-essential:3.0
    # The serving engine image the wizard presets inject (digest-pinned in
    # the v3-6-0-ea-2-kserve-config-llm-single-node-template-nvidia-cuda
    # LLMInferenceServiceConfig) — pinned so the CLI deploy matches the
    # wizard flow exactly.
    serving_image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9@sha256:97c7d6f66f3f0897b3ff10ddd135de930d45bdd116cf41a43e3ad7270029116a
    # The per-student project namespace (Module 1: "named after your lab
    # user"; the deploy wizard and the LLMInferenceService use it). Some
    # Module 3 snippets in the content show `llm` — Module 1's namespace is
    # the source of truth for what this playbook deploys.
    project_name: lab-user-dev
    tester_sa: model-tester
    # The lab user (rhoai chart values lab.adminUser): member of the
    # rhods-admins Group (00-rhods-admins-group.yaml) with node view RBAC
    # (05-nodes-view-rbac.yaml). Module 1 runs `oc get nodes` as this user.
    lab_user: lab-user1
    # -- MaaS (Module 3) -----------------------------------------------------
    maas_api_version: maas.opendatahub.io/v1alpha1
    maas_api_namespace: redhat-ods-applications
    maas_subscription_namespace: models-as-a-service
    # The MaaS tier is provisioned by the maas-tier chart (ArgoCD
    # rhai-maas-tier, wave 6): the e2e VERIFIES it and mints its API key
    # against it — it never creates subscriptions. Learners have no RBAC in
    # models-as-a-service, and the former manual apply went stale on the
    # gpt-oss model switch. The tier's owner group is the group the OpenShift
    # OAuth/OIDC identity presents to the gateway — plain
    # system:authenticated never matches, so every call would 403.
    maas_subscription_name: maas-free-subscription
    gateway_name: maas-default-gateway
    gateway_namespace: openshift-ingress
    # -- Application (Module 4) ----------------------------------------------
    app_name: maas-chat-client
    app_image: registry.access.redhat.com/ubi9/python-311:latest
    app_secret: maas-credentials
    app_prompt: "Explain Model-as-a-Service in one sentence."
    app_interval: "30"
    # -- Observability (Module 6) --------------------------------------------
    uwm_namespace: openshift-user-workload-monitoring
    dashboard_namespace: redhat-ods-applications
    # -- Sample application source (Module 4) --------------------------------
    # maas_chat_client.py exactly as printed in the module content, mounted
    # into the pod via the ConfigMap below (students review the same file in
    # Dev Spaces).
    maas_chat_client_py: |
      #!/usr/bin/env python3
      """A minimal chat client for the Model-as-a-Service endpoint from Module 3."""
      import json, os, sys, time
      import urllib.error
      import urllib.request

      API_URL = os.environ.get("MAAS_URL", "").rstrip("/")
      API_KEY = os.environ.get("MAAS_API_KEY", "")
      MODEL = os.environ.get("MAAS_MODEL", "")
      PROMPT = os.environ.get("MAAS_PROMPT", "Explain Model-as-a-Service in one sentence.")
      INTERVAL = int(os.environ.get("MAAS_INTERVAL", "0"))
      SYSTEM = "You are a concise assistant."

      def chat_completions(model, messages, max_tokens=1000):
          """POST one Chat Completions request and return the parsed response."""
          # GPT-OSS handles reasoning natively via its harmony response format:
          # thinking can stay in the reasoning field and content comes back null,
          # so no request parameters or custom integration code are needed.
          payload = json.dumps({
              "model": model,
              "messages": messages,
              "max_tokens": max_tokens,
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{API_URL}/v1/chat/completions", data=payload, method="POST",
              headers={"Authorization": f"Bearer {API_KEY}", "Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=120) as response:
              return json.loads(response.read().decode("utf-8"))

      def discover_model():
          """Return the first ready model ID from the /v1/models catalog."""
          request = urllib.request.Request(f"{API_URL}/v1/models", headers={"Authorization": f"Bearer {API_KEY}"})
          with urllib.request.urlopen(request, timeout=30) as response:
              catalog = json.loads(response.read().decode("utf-8"))
          ready = [m for m in catalog.get("data", []) if m.get("ready", True)]
          if not ready:
              raise RuntimeError("no ready models in the catalog — check Module 3")
          return ready[0]["id"]

      def response_content(completion):
          """Return the answer text from a completion, handling reasoning models."""
          message = completion["choices"][0].get("message", {})
          return message.get("content") or message.get("reasoning") or ""

      def print_completion(completion):
          """Print one completion and its token usage."""
          usage = completion.get("usage", {})
          print(f"assistant> {response_content(completion).strip()}")
          print(f"[tokens: {usage.get('prompt_tokens', '?')} in / {usage.get('completion_tokens', '?')} out]")

      def run_interactive(model):
          """Chat loop: read prompts from the terminal until you type quit."""
          print("Chat client ready. Type a prompt, or 'quit' to exit.")
          history = []
          while True:
              try:
                  user_input = input("you> ").strip()
              except (EOFError, KeyboardInterrupt):
                  break
              if not user_input or user_input.lower() in ("quit", "exit"):
                  break
              messages = [{"role": "system", "content": SYSTEM}] + history + [{"role": "user", "content": user_input}]
              try:
                  completion = chat_completions(model, messages)
                  print_completion(completion)
                  history += [{"role": "user", "content": user_input},
                              {"role": "assistant", "content": response_content(completion)}]
              except urllib.error.HTTPError as exc:
                  print(f"HTTP {exc.code}: {exc.reason} — check your endpoint URL and API key")
                  continue
              except urllib.error.URLError as exc:
                  print(f"endpoint unreachable: {exc}")
                  continue
              except Exception as exc:
                  print(f"request failed: {exc}")
                  continue
          print("Bye!")

      def run_request_loop(model):
          """Deployed mode: send PROMPT every INTERVAL seconds and log results."""
          print(f"Request loop started — one completion every {INTERVAL}s.")
          while True:
              messages = [{"role": "system", "content": SYSTEM}, {"role": "user", "content": PROMPT}]
              try:
                  completion = chat_completions(model, messages)
                  print_completion(completion)
              except urllib.error.HTTPError as exc:
                  print(f"HTTP {exc.code}: {exc.reason} — check your endpoint URL and API key")
              except urllib.error.URLError as exc:
                  print(f"endpoint unreachable: {exc}")
              except Exception as exc:
                  print(f"request failed: {exc}")
              time.sleep(INTERVAL)

      def main():
          if not API_URL or not API_KEY:
              sys.exit("Set MAAS_URL and MAAS_API_KEY before starting the client.")
          model = MODEL
          # Log and wait instead of crashing: an expired or unauthorized key (403)
          # or a temporarily empty catalog is transient — the deployment re-rolls
          # with a fresh key, or the catalog repopulates, and the client recovers.
          while not model:
              try:
                  model = discover_model()
              except urllib.error.HTTPError as exc:
                  print(f"HTTP {exc.code}: {exc.reason} — retrying model discovery in 60s")
              except Exception as exc:
                  print(f"model discovery failed: {exc} — retrying in 60s")
              if not model:
                  time.sleep(60)
          print(f"Using model: {model}")
          if INTERVAL > 0:
              run_request_loop(model)
          else:
              run_interactive(model)

      if __name__ == "__main__":
          main()

  tasks:

    # ========================================================================
    # PREFLIGHT (M0) — chart-provided platform signals
    # ========================================================================
    # The platform (RHOAI operators, DSC, MaaS gateway, Kueue queues,
    # accelerator config, MaaS tier) is GitOps-managed by the app-of-apps
    # charts (automation/gitops/) and synced by ArgoCD — this playbook never
    # applies platform resources. The preflight polls the chart-provided
    # signals so an unsynced chart fails fast here with a readable name
    # instead of failing deep in Module 1 with an opaque error.

    - name: "M0 | ENV | Polling for rhods CSV to succeed (retries expected, ~5 min)"
      ansible.builtin.command: >-
        oc wait csv -n redhat-ods-operator
        -l operators.coreos.com/rhods-operator.redhat-ods-operator
        --for=jsonpath='{.status.phase}'=Succeeded --timeout=60s
      register: result
      until: result.rc == 0
      retries: 15
      delay: 30
      changed_when: false

    - name: "M0 | ENV | Polling for DSC Ready (retries expected, ~10 min)"
      kubernetes.core.k8s_info:
        api_version: datasciencecluster.opendatahub.io/v1
        kind: DataScienceCluster
      register: dsc
      until: >-
        dsc.resources | length > 0 and (
        dsc.resources[0].status.phase | default('') == 'Ready' or
        dsc.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Ready') | selectattr('status', 'eq', 'True')
        | list | length > 0)
      retries: 20
      delay: 30

    - name: "M0 | ENV | Polling for the MaaS gateway to be Programmed"
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: "{{ gateway_name }}"
        namespace: "{{ gateway_namespace }}"
      register: gw
      until: >-
        gw.resources | length > 0 and
        gw.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Programmed') | selectattr('status', 'eq', 'True')
        | list | length > 0
      retries: 10
      delay: 30

    - name: "M0 | ENV | Polling for the Kueue ClusterQueue default (operator-configs chart)"
      # The ClusterQueue carries the lab's GPU quota (nvidia.com/gpu: 1) —
      # without it the Kueue-managed model deployment stays Inadmissible.
      ansible.builtin.command: oc get clusterqueue default -o name
      register: cq
      until: cq.rc == 0
      retries: 10
      delay: 15
      changed_when: false

    - name: "M0 | ENV | Polling for the GPU accelerator config (model-serving chart)"
      kubernetes.core.k8s_info:
        api_version: "{{ llis_api_version }}"
        kind: LLMInferenceServiceConfig
        name: "{{ accel_config_name }}"
        namespace: "{{ accel_config_namespace }}"
      register: accel
      until: accel.resources | length > 0
      retries: 10
      delay: 15

    - name: "M0 | ENV | Polling for the MaaS tier subscription (maas-tier chart)"
      kubernetes.core.k8s_info:
        api_version: "{{ maas_api_version }}"
        kind: MaaSSubscription
        name: "{{ maas_subscription_name }}"
        namespace: "{{ maas_subscription_namespace }}"
      register: tier_sub
      until: tier_sub.resources | length > 0
      retries: 10
      delay: 15

    - name: "M0 | ENV | Polling for the MaaS tier auth policy (maas-tier chart)"
      kubernetes.core.k8s_info:
        api_version: "{{ maas_api_version }}"
        kind: MaaSAuthPolicy
        name: "{{ maas_subscription_name }}-policy"
        namespace: "{{ maas_subscription_namespace }}"
      register: tier_policy
      until: tier_policy.resources | length > 0
      retries: 10
      delay: 15

    # ========================================================================
    # MODULE 1 — Deploy the model for inference
    # ========================================================================
    # Students deploy through the model serving wizard in the dashboard (UI —
    # manual checklist module-1). Here we apply the equivalent
    # LLMInferenceService exactly as printed in the module content, then poll
    # for Ready and verify the serving endpoint with the model-tester token.

    - name: "M1 | VERIFY — lab user (rhods-admins) can view cluster nodes (nodes-viewer RBAC)"
      # --as-group is required alongside --as: impersonation does not resolve
      # OpenShift Group CRD membership (that lookup happens at login), and on
      # a fresh cluster the lab user has no User object yet. A real lab-user
      # token carries rhods-admins via the Group CRD, so impersonating the
      # group reproduces the student's permissions. The check still fails if
      # the nodes-viewer ClusterRoleBinding is missing (chart 05 file).
      ansible.builtin.command: oc get nodes -L nvidia.com/gpu.product --as={{ lab_user }} --as-group=rhods-admins
      changed_when: false

    - name: "M1 | Create the student project (idempotent)"
      ansible.builtin.command: oc new-project {{ project_name }}
      register: result
      failed_when: result.rc != 0 and 'already exists' not in result.stderr
      changed_when: "'already exists' not in result.stderr"

    - name: "M1 | Label the project so it appears in the RHOAI dashboard projects UI (idempotent)"
      ansible.builtin.command: oc label namespace {{ project_name }} opendatahub.io/dashboard=true --overwrite
      register: ns_label
      failed_when: ns_label.rc != 0
      changed_when: ns_label.stdout is search('labeled|not labeled')

    - name: "M1 | Label the project as Kueue-managed (idempotent)"
      # The dashboard adds this label on project creation; `oc new-project`
      # does not. It is what makes the RHOAI operator's queue management
      # treat the project's workloads as Kueue-managed.
      ansible.builtin.command: oc label namespace {{ project_name }} kueue.openshift.io/managed=true --overwrite
      register: kueue_label
      failed_when: kueue_label.rc != 0
      changed_when: kueue_label.stdout is search('labeled|not labeled')

    - name: "M1 | Label the project as an EvalHub evaluation tenant (module-02 Ex 1)"
      # The EvalHub operator watches for this label and provisions the
      # namespace's evaluation RBAC within seconds — the job service account
      # and the evalhub service's read access to the model-auth secret
      # (module-02 Ex 1). Without it the M2 submit fails with
      # "secrets model-auth is forbidden" for the evalhub service.
      ansible.builtin.command: oc label namespace {{ project_name }} evalhub.trustyai.opendatahub.io/tenant=true --overwrite
      register: evalhub_tenant_label
      failed_when: evalhub_tenant_label.rc != 0
      changed_when: evalhub_tenant_label.stdout is search('labeled|not labeled')

    - name: "M1 | Label the project as dashboard-generated (module-02 Ex 1)"
      # The redhat-ods-applications default-deny ingress policy only allows
      # namespaces with this label — without it the eval pods' status-event
      # POSTs to the EvalHub service time out and the run stays Pending while
      # the K8s jobs Complete (the "Pending forever" bug, checklist 2026-10-27).
      ansible.builtin.command: oc label namespace {{ project_name }} opendatahub.io/generated-namespace=true --overwrite
      register: generated_ns_label
      failed_when: generated_ns_label.rc != 0
      changed_when: generated_ns_label.stdout is search('labeled|not labeled')

    - name: "M1 | Polling for the auto-created LocalQueue default (retries expected, ~2 min)"
      # The DSC kueue component (autoCreateQueues: true, bootstrap
      # 31-dsc.yaml) makes the operator create a LocalQueue named `default`
      # in each kueue-managed namespace. Without it the model server pod
      # sits Inadmissible with "Queue default queue does not exist".
      ansible.builtin.command: oc get localqueue default -n {{ project_name }} -o name
      register: local_queue
      until: local_queue.rc == 0
      retries: 12
      delay: 15
      changed_when: false

    - name: "M1 | Create the model-tester service account (idempotent)"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ tester_sa }}"
            namespace: "{{ project_name }}"
        state: present
      changed_when: true

    - name: "M1 | Apply the LLMInferenceService from Module 1"
      kubernetes.core.k8s:
        definition:
          apiVersion: "{{ llis_api_version }}"
          kind: LLMInferenceService
          metadata:
            name: "{{ model_name }}"
            namespace: "{{ project_name }}"
            annotations:
              openshift.io/display-name: GPT-OSS 20B (essential variant)
              opendatahub.io/model-type: generative
              opendatahub.io/hardware-profile-name: gpu-serving
              opendatahub.io/hardware-profile-namespace: redhat-ods-applications
              security.opendatahub.io/enable-auth: "true"
            labels:
              kueue.x-k8s.io/queue-name: default
              opendatahub.io/dashboard: "true"
              opendatahub.io/genai-asset: "true"
          spec:
            model:
              name: "{{ model_name }}"
              uri: "{{ modelcar_image }}"
            replicas: 1
            router:
              gateway:
                refs:
                  - name: openshift-ai-inference
                    namespace: openshift-ingress
              route: {}
            template:
              containers:
                - name: main
                  image: "{{ serving_image }}"
                  env:
                    - name: VLLM_ADDITIONAL_ARGS
                      value: >-
                        --enable-auto-tool-choice
                        --tool-call-parser openai
                  resources:
                    requests:
                      cpu: "2"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                    limits:
                      cpu: "2"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
              tolerations:
                - effect: NoSchedule
                  key: nvidia.com/gpu
                  operator: Equal
                  value: l4-gpu
        state: present
      changed_when: true

    - name: "M1 | Polling for LLMInferenceService Ready (retries expected, ~10-15 min)"
      # jsonpath wait form: `--for=condition=Ready` hangs on KServe-family
      # CRs once metadata.generation moves past status.observedGeneration
      # (the staleness check never clears even when Ready) — the jsonpath
      # form evaluates the raw condition status and does not stale-check.
      ansible.builtin.command: >-
        oc wait --for='jsonpath={.status.conditions[?(@.type=="Ready")].status}=True'
        llminferenceservice/{{ model_name }} -n {{ project_name }} --timeout=60s
      register: result
      until: result.rc == 0
      retries: 30
      delay: 30

    - name: "M1 | Get the model serving endpoint URL"
      ansible.builtin.command: >-
        oc get llminferenceservice {{ model_name }} -n {{ project_name }}
        -o jsonpath='{.status.url}'
      register: model_url
      changed_when: false

    - name: "M1 | Mint a model-tester token for inference requests"
      ansible.builtin.command: oc create token {{ tester_sa }} -n {{ project_name }} --duration=1h
      register: model_token
      changed_when: false
      no_log: true

    - name: "M1 | VERIFY — serving endpoint accepts authenticated requests"
      ansible.builtin.uri:
        url: "{{ model_url.stdout }}/v1/models"
        method: GET
        headers:
          Authorization: "Bearer {{ model_token.stdout }}"
        validate_certs: false
        status_code: 200
      register: m1_models
      until: m1_models.status | default(0) == 200
      retries: 10
      delay: 10
      changed_when: false
      no_log: true

    - name: "M1 | VERIFY — model returns a chat completion"
      ansible.builtin.uri:
        url: "{{ model_url.stdout }}/v1/chat/completions"
        method: POST
        headers:
          Authorization: "Bearer {{ model_token.stdout }}"
          Content-Type: application/json
        body:
          model: "{{ model_name }}"
          messages:
            - role: user
              content: "In one sentence, what is Model as a Service?"
        body_format: json
        validate_certs: false
        status_code: 200
      register: m1_chat
      until: >-
        m1_chat.status | default(0) == 200 and
        ((m1_chat.json.choices[0].message.content
        or m1_chat.json.choices[0].message.reasoning
        or '') | length > 0)
      retries: 5
      delay: 10
      changed_when: false
      no_log: true

    # ========================================================================
    # MODULE 2 — Evaluate and benchmark with EvalHub (evalhub CLI)
    # ========================================================================
    # Module 2 runs evaluations through the evalhub CLI against the model
    # deployed in Module 1. The CLI flow (module-02 Ex 1 + Ex 2) and the
    # repeatable config-file run (Ex 4) are automated here; the dashboard
    # evaluation form (Ex 3) is UI-only — manual checklist
    # (qa/runs/redhat-ai-inference/module2-evalhub-checklist.md).
    #
    # Facts from the verified checklist (2026-10-27):
    #   - The model URL is the LLIS status.url + /v1 (the external gateway
    #     hostname resolves in-cluster and the eval job sidecars chain the
    #     cert to the pod's SA ca.crt — no TLS config needed)
    #   - The tokenizer param is MANDATORY: the served model name is not an
    #     HF identifier, so without it the job fails with "not a valid model
    #     identifier listed on huggingface.co"
    #   - The docs' mmlu/hellaswag benchmark IDs DO NOT EXIST in this build
    #     (191 benchmarks, different variants); arc_easy + truthfulqa_mc1
    #     are the verified picks
    #   - 10 examples per benchmark completes in ~1-2 min once the pods are
    #     up; eval pods run as K8s Jobs in the student project (evalhub job
    #     ID prefixed) — a Pending state is the missing namespace labels
    #     (both set in M1), not GPU scheduling (the pods are tiny, no GPU)
    #   - The evalhub startup-probe race (evalhub pod starting before MLflow)
    #     breaks the DASHBOARD path only — the CLI path never calls MLflow
    #     at job creation, so this flow is immune; do not restart evalhub
    #     from this playbook (chart-owned resource)

    - name: "M2 | VERIFY — evalhub CLI is installed (pip bootstrap if missing)"
      ansible.builtin.shell: |
        if command -v evalhub >/dev/null 2>&1; then
          evalhub --version
        else
          python3 -m pip --version >/dev/null 2>&1 || {
            curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py --user
          }
          # the [cli] extra is REQUIRED: click/packaging/pyyaml/rich ship in it
          python3 -m pip install --user "eval-hub-sdk[cli]"
          export PATH="$HOME/.local/bin:$PATH"
          evalhub --version
        fi
      register: m2_cli
      changed_when: "'install' in m2_cli.stdout | lower"

    - name: "M2 | Discover the cluster apps domain"
      ansible.builtin.command: oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}'
      register: cluster_domain
      changed_when: false

    - name: "M2 | Configure the evalhub CLI (idempotent)"
      ansible.builtin.shell: |
        evalhub config set base_url "https://evalhub-redhat-ods-applications.{{ cluster_domain.stdout | trim }}"
        evalhub config set tenant "{{ project_name }}"
        evalhub config set token "$(oc whoami -t)"
        evalhub config set insecure true
      changed_when: false

    - name: "M2 | VERIFY — EvalHub service is healthy"
      ansible.builtin.command: evalhub health
      register: m2_health
      until: m2_health.stdout is search('healthy')
      retries: 5
      delay: 10
      changed_when: false

    - name: "M2 | Create the model authentication secret (module-02 Ex 1)"
      # The e2e flow does not create the wizard's token Secret (model-tester-
      # <model>-sa) — the module-02 secret is created from Module 1's
      # model-tester token instead. dry-run|apply updates the api-key each
      # run (the M1 token is minted fresh with a 1h expiry).
      ansible.builtin.shell: |
        oc create secret generic model-auth \
          --from-literal=api-key={{ model_token.stdout | trim }} \
          -n {{ project_name }} --dry-run=client -o yaml | oc apply -f -
      no_log: true
      changed_when: true

    - name: "M2 | Submit the benchmark evaluation and wait (module-02 Ex 2)"
      # NOTE: no --experiment flag. The server-side get-or-create experiment
      # call fails with MLflow 403 PERMISSION_DENIED (the evalhub server's
      # ServiceAccount has no RBAC in the tenant namespace; verified live on
      # k6lj7). Without the flag the run still logs to MLflow — the eval job
      # sidecars push metrics at run time with the tenant-provisioned RBAC
      # (checklist 2026-10-27: mlflow_run_id set on a run with no --experiment).
      ansible.builtin.shell: |
        evalhub eval run \
          --name "e2e-baseline-$RANDOM" \
          --model-url "{{ model_url.stdout | trim }}/v1" \
          --model-name "{{ model_name }}" \
          --provider lm_evaluation_harness \
          -b arc_easy -b truthfulqa_mc1 \
          --model-auth-secret model-auth \
          --param num_examples=10 \
          --param tokenizer=openai/gpt-oss-20b \
          --wait --timeout 900 --format json
      register: eval_run
      changed_when: true

    - name: "M2 | VERIFY — evaluation completed successfully"
      ansible.builtin.assert:
        that:
          - eval_run.rc == 0
          - "'completed' in eval_run.stdout"
        fail_msg: >-
          The benchmark evaluation did not complete — inspect it with
          'evalhub eval status' (job pods run in {{ project_name }}; a
          Pending state usually means the namespace labels from M1 are
          missing or the evalhub deployment needs a restart after a fresh
          MLflow startup — see module-02 troubleshooting).

    - name: "M2 | Set the evaluation job ID from the submit output"
      # The job ID is a full UUID (e.g. 9145a448-8541-4086-91b7-9e58d5c60856)
      # — extracting only the first 8-hex segment 404s on the results call.
      ansible.builtin.set_fact:
        eval_job_id: "{{ eval_run.stdout | regex_findall('[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}') | first }}"
      changed_when: false

    - name: "M2 | VERIFY — results include the benchmark metrics"
      ansible.builtin.shell: evalhub eval results {{ eval_job_id }} --format json
      register: eval_results
      until: >-
        eval_results.rc == 0 and
        'arc_easy' in eval_results.stdout and
        'acc' in eval_results.stdout
      retries: 5
      delay: 10
      changed_when: false

    - name: "M2 | VERIFY — the run is tracked in MLflow"
      # The results link the MLflow experiment the run is logged to; a
      # missing link means the tracking URI lost the /mlflow static prefix
      # (automation/gitops/maas/templates/50-evalhub.yaml) or the evalhub
      # deployment hit the startup-probe race.
      ansible.builtin.assert:
        that: "'mlflow' in eval_results.stdout | lower"
        fail_msg: >-
          The run did not log to MLflow — check the EvalHub CR's
          MLFLOW_TRACKING_URI carries the /mlflow static prefix (the maas
          chart 50-evalhub.yaml) and that evalhub started after MLflow.

    - name: "M2 | Ex 4 — write the repeatable evaljob config (module-02 Ex 4)"
      # The config-file shape from module-02: benchmark parameters live under
      # each benchmark entry (no global --param equivalent), `id:` per
      # benchmark (NOT benchmark_id). The model URL is the LLIS status URL +
      # /v1 — the same {inference_gateway_url}/{project}/{model}/v1 shape the
      # module's config file prints. No experiment: section — the server-side
      # get-or-create fails with MLflow 403 (see the Ex 2 submit note).
      ansible.builtin.copy:
        content: |
          name: "e2e-config-baseline-{{ 999999 | random }}"
          model:
            url: "{{ model_url.stdout | trim }}/v1"
            name: "{{ model_name }}"
            auth:
              secret_ref: model-auth
          benchmarks:
            - provider_id: lm_evaluation_harness
              id: arc_easy
              parameters:
                num_examples: 10
                tokenizer: openai/gpt-oss-20b
            - provider_id: lm_evaluation_harness
              id: truthfulqa_mc1
              parameters:
                num_examples: 10
                tokenizer: openai/gpt-oss-20b
        dest: /tmp/evaljob-e2e.yaml
        mode: "0644"
      changed_when: true

    - name: "M2 | Ex 4 — submit the config-file evaluation and wait"
      ansible.builtin.shell: |
        evalhub eval run --config /tmp/evaljob-e2e.yaml --wait --timeout 900 --format json
      register: eval_config_run
      changed_when: true

    - name: "M2 | Ex 4 — VERIFY — config-file evaluation completed"
      ansible.builtin.assert:
        that: "'completed' in eval_config_run.stdout"
        fail_msg: >-
          The config-file evaluation did not complete — the config shape is
          printed in module-02 Ex 4 (parameters under each benchmark entry,
          `id:` per benchmark).

    # ========================================================================
    # MODULE 3 — Expose the model as Model-as-a-Service
    # ========================================================================
    # Publishing the model to MaaS creates a MaaSModelRef in the model's
    # project namespace. The subscription tier (maas-free-subscription) is
    # provisioned by the maas-tier chart (ArgoCD rhai-maas-tier, wave 6) —
    # the e2e verifies it and never creates subscriptions (the former manual
    # apply went stale on the gpt-oss model switch). Students verify these in
    # the console (UI — manual checklist); here we
    # verify the resources, confirm Kueue quota gating by scaling to two
    # replicas (module-03 Ex 4), and drive inference through the MaaS
    # gateway with an API key minted via the MaaS API.

    - name: "M3 | Check if MaaSModelRef exists for the model"
      kubernetes.core.k8s_info:
        api_version: "{{ maas_api_version }}"
        kind: MaaSModelRef
        namespace: "{{ project_name }}"
      register: mmr_check
      changed_when: false

    - name: "M3 | Re-attach the model to the MaaS gateway (governance pairing needs the model route on maas-default-gateway)"
      command:
        argv:
          - oc
          - patch
          - llminferenceservice
          - "{{ model_name }}"
          - -n
          - "{{ project_name }}"
          - --type=merge
          - -p
          - '{"spec":{"router":{"gateway":{"refs":[{"name":"maas-default-gateway","namespace":"openshift-ingress"}]}}}}'
      changed_when: true

    - name: "M3 | Wait for the gateway re-attach to settle (route re-rolls)"
      # jsonpath wait form — see the M1 polling task note: the patch bumps
      # metadata.generation, which makes --for=condition=Ready hang on the
      # observedGeneration staleness check even when Ready.
      command:
        argv:
          - oc
          - wait
          - '--for=jsonpath={.status.conditions[?(@.type=="Ready")].status}=True'
          - llminferenceservice/{{ model_name }}
          - -n
          - "{{ project_name }}"
          - --timeout=60s
      register: llis_gateway_wait
      until: llis_gateway_wait.rc == 0
      retries: 10
      delay: 15
      changed_when: true

    - name: "M3 | Publish the model to MaaS (skipped if already published)"
      kubernetes.core.k8s:
        definition:
          apiVersion: "{{ maas_api_version }}"
          kind: MaaSModelRef
          metadata:
            name: "{{ model_name }}"
            namespace: "{{ project_name }}"
          spec:
            modelRef:
              kind: LLMInferenceService
              name: "{{ model_name }}"
            tenantRef: models-as-a-service
        state: present
      when: >-
        mmr_check.resources
        | selectattr('metadata.name', 'equalto', model_name) | list | length == 0
      changed_when: true

    - name: "M3 | Polling for MaaSModelRef Ready (retries expected, ~5 min)"
      kubernetes.core.k8s_info:
        api_version: "{{ maas_api_version }}"
        kind: MaaSModelRef
        name: "{{ model_name }}"
        namespace: "{{ project_name }}"
      register: mmr
      until: >-
        mmr.resources | length > 0 and
        mmr.resources[0].status.phase | default('') == 'Ready'
      retries: 20
      delay: 15

    - name: "M3 | VERIFY — MaaS tier subscription is Active (provisioned by the maas-tier chart)"
      # The subscription references the student's MaaSModelRef, which only
      # becomes Ready above; the tier converges Failed → Active when the
      # modelRef lands. Learners have no RBAC to create these — verifying is
      # the whole job.
      kubernetes.core.k8s_info:
        api_version: "{{ maas_api_version }}"
        kind: MaaSSubscription
        name: "{{ maas_subscription_name }}"
        namespace: "{{ maas_subscription_namespace }}"
      register: tier_sub
      until: >-
        tier_sub.resources | length > 0 and
        tier_sub.resources[0].status.phase | default('') == 'Active'
      retries: 20
      delay: 15

    - name: "M3 | VERIFY — MaaS tier auth policy is Active (provisioned by the maas-tier chart)"
      # A subscription without a matching policy returns HTTP 429; a policy
      # without a matching subscription returns HTTP 403 — both must be
      # Active before the gateway accepts API keys.
      kubernetes.core.k8s_info:
        api_version: "{{ maas_api_version }}"
        kind: MaaSAuthPolicy
        name: "{{ maas_subscription_name }}-policy"
        namespace: "{{ maas_subscription_namespace }}"
      register: tier_policy
      until: >-
        tier_policy.resources | length > 0 and
        tier_policy.resources[0].status.phase | default('') == 'Active'
      retries: 20
      delay: 15

    - name: "M3 | VERIFY — MaaS gateway is Programmed"
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: "{{ gateway_name }}"
        namespace: "{{ gateway_namespace }}"
      register: gw
      failed_when: >-
        gw.resources | length == 0 or
        not (gw.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Programmed') | selectattr('status', 'eq', 'True')
        | list | length > 0)

    - name: "M3 | Discover the cluster apps domain"
      ansible.builtin.command: oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}'
      register: cluster_domain
      changed_when: false

    - name: "M3 | Set the MaaS gateway URL"
      ansible.builtin.set_fact:
        maas_url: "https://maas.{{ cluster_domain.stdout | trim }}"

    - name: "M3 | Mint a MaaS API key against the maas-free-subscription tier"
      ansible.builtin.shell: |
        curl -sSk -X POST "{{ maas_url }}/maas-api/v1/api-keys" \
          -H "Authorization: Bearer $(oc whoami -t)" \
          -H "Content-Type: application/json" \
          -d '{"name":"e2e-key-'$RANDOM'","expiresIn":"1h","subscription":"{{ maas_subscription_name }}"}' | jq -r .key
      register: maas_api_key
      until:
        maas_api_key.rc == 0 and
        maas_api_key.stdout | trim | length > 0 and
        maas_api_key.stdout | trim != 'null'
      retries: 5
      delay: 15
      changed_when: false
      no_log: true

    # -- Exercise 4: Scale and confirm Kueue quota gating (module-03 Ex 4) --
    # The ClusterQueue's GPU quota is 1, so the second replica stays
    # SchedulingGated while the first keeps serving — nothing is lost. On a
    # multi-GPU cluster the second pod comes up Running the same way.

    - name: "M3-Ex4 | Scale the model to two replicas"
      ansible.builtin.command: >-
        oc patch llminferenceservice {{ model_name }} -n {{ project_name }}
        --type merge -p '{"spec":{"replicas":2}}'
      changed_when: true

    - name: "M3-Ex4 | Polling for the second replica to be Kueue-gated (retries expected)"
      # Kueue gates the pod via schedulingGates + the PodScheduled condition
      # (reason=SchedulingGated). pod.status.reason is NOT set on this
      # kubelet (v1.35.8), and conditions like Ready=True omit the reason
      # field entirely — so the leaf access must be tolerant (map + default).
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ project_name }}"
      register: scale_pods
      until: >-
        scale_pods.resources
        | selectattr('metadata.name', 'match', '^' ~ model_name)
        | map(attribute='status.conditions')
        | flatten
        | selectattr('type', 'equalto', 'PodScheduled')
        | map(attribute='reason', default='')
        | select('equalto', 'SchedulingGated')
        | list | length >= 1
      retries: 20
      delay: 10

    - name: "M3-Ex4 | VERIFY — the first replica keeps serving while the second is gated"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ project_name }}"
      register: gated_pods
      failed_when: >-
        gated_pods.resources
        | selectattr('metadata.name', 'match', '^' ~ model_name)
        | selectattr('status.phase', 'equalto', 'Running') | list | length != 1

    - name: "M3-Ex4 | Scale the model back to one replica"
      ansible.builtin.command: >-
        oc patch llminferenceservice {{ model_name }} -n {{ project_name }}
        --type merge -p '{"spec":{"replicas":1}}'
      changed_when: true

    - name: "M3-Ex4 | Polling for the gated replica to be removed"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ project_name }}"
      register: back_pods
      until: >-
        back_pods.resources
        | selectattr('metadata.name', 'match', '^' ~ model_name)
        | selectattr('status.phase', 'equalto', 'Running') | list | length == 1 and
        back_pods.resources
        | selectattr('metadata.name', 'match', '^' ~ model_name)
        | map(attribute='status.conditions')
        | flatten
        | selectattr('type', 'equalto', 'PodScheduled')
        | map(attribute='reason', default='')
        | select('equalto', 'SchedulingGated')
        | list | length == 0
      retries: 20
      delay: 10

    - name: "M3 | VERIFY — MaaS gateway route serves the model catalog"
      ansible.builtin.shell: |
        RESPONSE=$(curl -sSk "{{ maas_url }}/v1/models" \
          -H "Authorization: Bearer {{ maas_api_key.stdout | trim }}")
        echo "$RESPONSE" | jq -e '[.data[]? | select(.ready==true and (.id | contains("{{ model_name }}")))] | length > 0'
      register: result
      until: result.rc == 0
      retries: 10
      delay: 15
      changed_when: false
      no_log: true

    # ========================================================================
    # MODULE 4 — Integrate the model into an application
    # ========================================================================
    # Students configure and run the maas-chat-client in Dev Spaces (UI —
    # manual checklist module-4). Here we deploy the on-cluster
    # version exactly as in the module: the client code from a ConfigMap,
    # the endpoint URL and API key injected from the maas-credentials Secret,
    # and the request loop driven by MAAS_PROMPT / MAAS_INTERVAL.

    - name: "M4 | Apply the chat client ConfigMap with the app source"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ project_name }}"
          data:
            maas_chat_client.py: "{{ maas_chat_client_py }}"
        state: present
      changed_when: true

    - name: "M4 | Apply the maas-credentials Secret (values from Module 3, no literals)"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ app_secret }}"
            namespace: "{{ project_name }}"
          type: Opaque
          stringData:
            MAAS_URL: "{{ maas_url }}"
            MAAS_API_KEY: "{{ maas_api_key.stdout | trim }}"
        state: present
      no_log: true
      changed_when: true

    - name: "M4 | Apply the maas-chat-client Deployment"
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ project_name }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "{{ app_name }}"
            template:
              metadata:
                labels:
                  app: "{{ app_name }}"
              spec:
                containers:
                  - name: chat-client
                    image: "{{ app_image }}"
                    command: ["/bin/bash", "-c", "python3 /opt/client/maas_chat_client.py"]
                    envFrom:
                      - secretRef:
                          name: "{{ app_secret }}"
                    env:
                      - name: MAAS_PROMPT
                        value: "{{ app_prompt }}"
                      - name: MAAS_INTERVAL
                        value: "{{ app_interval }}"
                    volumeMounts:
                      - name: client-code
                        mountPath: /opt/client
                        readOnly: true
                volumes:
                  - name: client-code
                    configMap:
                      name: "{{ app_name }}"
        state: present
      changed_when: true

    - name: "M4 | Roll out the chat client with the fresh API key"
      # envFrom secretRef resolves at pod creation: a Secret re-apply with a
      # newly minted key does NOT reach a running pod, and the stale key is
      # expired (1h expiry) — every run must roll the pod so it picks up the
      # key this run minted (403 Unauthorized otherwise).
      ansible.builtin.command: oc rollout restart deploy/{{ app_name }} -n {{ project_name }}
      changed_when: true

    - name: "M4 | Polling for maas-chat-client Availability (retries expected, ~2 min)"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ project_name }}"
      register: app_dep
      until: >-
        app_dep.resources | length > 0 and
        (app_dep.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Available') | selectattr('status', 'eq', 'True')
        | list | length > 0)
      retries: 15
      delay: 10

    - name: "M4 | VERIFY — one request-loop request via oc exec returns a completion"
      ansible.builtin.command: >-
        oc exec deploy/{{ app_name }} -c chat-client -n {{ project_name }} --
        python3 -c "import sys; sys.path.insert(0, '/opt/client'); import maas_chat_client as c;
        model = c.MODEL or c.discover_model();
        comp = c.chat_completions(model, [{'role': 'system', 'content': c.SYSTEM},
        {'role': 'user', 'content': 'Reply with the single word OK.'}], max_tokens=16);
        print(comp['choices'][0]['message']['content'])"
      register: exec_result
      until: >-
        exec_result.rc == 0 and
        exec_result.stdout | trim | length > 0
      retries: 10
      delay: 15
      changed_when: false

    - name: "M4 | Polling for request-loop completions in the app logs (retries expected)"
      ansible.builtin.command: oc logs deployment/{{ app_name }} -c chat-client -n {{ project_name }}
      register: app_logs
      until: "'assistant>' in app_logs.stdout"
      retries: 10
      delay: 15
      changed_when: false

    # ========================================================================
    # MODULE 5 — Validate the end-to-end workflow
    # ========================================================================
    # Students trace the request chain (app → MaaS endpoint → model server)
    # in the console. The automated equivalent verifies each component of
    # that chain is healthy: the model server, the MaaS gateway, and the
    # consuming application. The M3 catalog check and M4 exec request
    # already proved a completion flows through the full chain.

    - name: "M5 | VERIFY — model server (LLMInferenceService) is Ready"
      kubernetes.core.k8s_info:
        api_version: "{{ llis_api_version }}"
        kind: LLMInferenceService
        name: "{{ model_name }}"
        namespace: "{{ project_name }}"
      register: llis
      failed_when: >-
        llis.resources | length == 0 or
        not (llis.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Ready') | selectattr('status', 'eq', 'True')
        | list | length > 0)

    - name: "M5 | VERIFY — MaaS gateway is Programmed"
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: "{{ gateway_name }}"
        namespace: "{{ gateway_namespace }}"
      register: gw
      failed_when: >-
        gw.resources | length == 0 or
        not (gw.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Programmed') | selectattr('status', 'eq', 'True')
        | list | length > 0)

    - name: "M5 | VERIFY — maas-chat-client deployment is Available"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ project_name }}"
      register: app_dep
      failed_when: >-
        app_dep.resources | length == 0 or
        not (app_dep.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Available') | selectattr('status', 'eq', 'True')
        | list | length > 0)

    # -- Module 5 Ex 2 / Ex 4: model server metrics scrape -------------------
    # The module forwards the model server metrics port (pod 8000 -> local
    # 8480) and greps the vLLM series; the pod serves its own TLS cert, so
    # curl -sk. The series are gauges — present from server startup.

    - name: "M5 | VERIFY — model server emits vLLM metrics (module-05 Ex 2)"
      ansible.builtin.shell: |
        MODEL_POD=$(oc get pods -n {{ project_name }} \
          -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' \
          | grep '^{{ model_name }}' | head -1)
        oc port-forward -n {{ project_name }} "$MODEL_POD" 8480:8000 > /dev/null 2>&1 &
        PF_PID=$!
        sleep 4
        curl -sk https://localhost:8480/metrics | grep -E 'vllm:num_requests_(running|waiting)' | head -3
        RC=$?
        kill $PF_PID 2>/dev/null
        exit $RC
      register: m5_metrics
      until: m5_metrics.rc == 0
      retries: 5
      delay: 10
      changed_when: false

    # -- Module 5 Ex 3: simulated credential failure (negative test) ---------
    # The module revokes the API key the application uses (dashboard ⋮→Revoke)
    # and observes the failure: the app logs HTTP 403 and the model server is
    # silent (the gateway rejected the request before forwarding it). Here the
    # revoke is driven through the MaaS API — the API equivalent of the
    # dialog. Fix and revert: mint a new key, patch the maas-credentials
    # Secret (module-04 Ex 2 mechanism), roll out, verify the app recovers.

    - name: "M5-Ex3 | Mint a throwaway MaaS API key for the revoke test"
      ansible.builtin.shell: |
        curl -sSk -X POST "{{ maas_url }}/maas-api/v1/api-keys" \
          -H "Authorization: Bearer $(oc whoami -t)" \
          -H "Content-Type: application/json" \
          -d '{"name":"e2e-revoke-'$RANDOM'","expiresIn":"1h","subscription":"{{ maas_subscription_name }}"}'
      register: revoke_mint
      until:
        revoke_mint.rc == 0 and
        revoke_mint.stdout | trim | length > 0 and
        'sk-oai-' in revoke_mint.stdout
      retries: 5
      delay: 15
      changed_when: false
      no_log: true

    - name: "M5-Ex3 | Revoke the key via the MaaS API"
      # Verified live (k6lj7): DELETE by the mint response's id (UUID) —
      # the response echoes the key metadata and subsequent requests with
      # the key return 403.
      ansible.builtin.shell: |
        curl -sSk -X DELETE "{{ maas_url }}/maas-api/v1/api-keys/{{ (revoke_mint.stdout | from_json).id }}" \
          -H "Authorization: Bearer $(oc whoami -t)"
      register: revoke_call
      changed_when: true
      no_log: true

    - name: "M5-Ex3 | VERIFY — the revoked key is rejected"
      # A revoked (bad) key surfaces as 401/403 at the gateway — the model
      # server never sees the request. Accept either code: 401
      # (authentication_error, bad key) or 403 (authorization_error).
      ansible.builtin.uri:
        url: "{{ maas_url }}/v1/models"
        method: GET
        headers:
          Authorization: "Bearer {{ (revoke_mint.stdout | from_json).key }}"
        validate_certs: false
        status_code: 401, 403
      register: revoked_check
      changed_when: false
      no_log: true

    - name: "M5-Ex3 | Break the app's credential (patch the maas-credentials Secret)"
      # The module revokes the APP's key; the API equivalent for the e2e is
      # replacing the Secret's key with the revoked one — the app then
      # observes the same 403 the module describes.
      ansible.builtin.shell: |
        oc patch secret {{ app_secret }} -n {{ project_name }} --type merge \
          -p '{"stringData":{"MAAS_API_KEY":"{{ (revoke_mint.stdout | from_json).key }}"}}'
      no_log: true
      changed_when: true

    - name: "M5-Ex3 | Roll out the app with the revoked key"
      ansible.builtin.command: oc rollout restart deploy/{{ app_name }} -n {{ project_name }}
      changed_when: true

    - name: "M5-Ex3 | Polling for the app to fail with HTTP 403 (module-05 Ex 3)"
      ansible.builtin.command: oc logs deployment/{{ app_name }} -c chat-client -n {{ project_name }} --tail=20
      register: m5_fail_logs
      until: "'HTTP 403' in m5_fail_logs.stdout or 'HTTP 401' in m5_fail_logs.stdout"
      retries: 20
      delay: 15
      changed_when: false

    - name: "M5-Ex3 | Fix — restore the app with a fresh key (module-05 Ex 3 revert)"
      ansible.builtin.shell: |
        curl -sSk -X POST "{{ maas_url }}/maas-api/v1/api-keys" \
          -H "Authorization: Bearer $(oc whoami -t)" \
          -H "Content-Type: application/json" \
          -d '{"name":"e2e-restore-'$RANDOM'","expiresIn":"1h","subscription":"{{ maas_subscription_name }}"}' \
          | jq -r .key > /tmp/e2e-restore-key.txt
        oc patch secret {{ app_secret }} -n {{ project_name }} --type merge \
          -p "{\"stringData\":{\"MAAS_API_KEY\":\"$(cat /tmp/e2e-restore-key.txt)\"}}"
        rm -f /tmp/e2e-restore-key.txt
      register: m5_restore
      until: m5_restore.rc == 0 and (m5_restore.stdout | trim | length) > 0
      retries: 5
      delay: 15
      changed_when: true
      no_log: true

    - name: "M5-Ex3 | Roll out the app with the fresh key"
      ansible.builtin.command: oc rollout restart deploy/{{ app_name }} -n {{ project_name }}
      changed_when: true

    - name: "M5-Ex3 | Polling for the app to recover (module-05 Ex 3 revert)"
      ansible.builtin.command: >-
        oc exec deploy/{{ app_name }} -c chat-client -n {{ project_name }} --
        python3 -c "import sys; sys.path.insert(0, '/opt/client'); import maas_chat_client as c;
        model = c.MODEL or c.discover_model();
        comp = c.chat_completions(model, [{'role': 'system', 'content': c.SYSTEM},
        {'role': 'user', 'content': 'Reply with the single word OK.'}], max_tokens=16);
        print(comp['choices'][0]['message']['content'])"
      register: m5_recover
      until: m5_recover.rc == 0 and m5_recover.stdout | trim | length > 0
      retries: 10
      delay: 15
      changed_when: false

    # ========================================================================
    # MODULE 6 — Monitor model performance through observability
    # ========================================================================
    # Students explore the Cluster and Usage dashboards (UI — manual
    # checklists). The automated equivalent verifies the metric
    # pipelines behind the dashboard are active: user workload monitoring is
    # enabled (namespace + Prometheus pods), the observability dashboard flag
    # is on, and the model server pods (the scrape target — vLLM engine
    # metrics appear after a request, which the M4 request loop guarantees)
    # are up. Note: the DSC v2 CRD has no monitoring component — UWM is
    # cluster-level, not a DSC component.

    - name: "M6 | User workload monitoring namespace exists"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ uwm_namespace }}"
      register: uwm_ns
      failed_when: uwm_ns.resources | length == 0

    - name: "M6 | Observability dashboard flag is enabled"
      ansible.builtin.command: >-
        oc get odhdashboardconfig odh-dashboard-config -n {{ dashboard_namespace }}
        -o jsonpath='{.spec.dashboardConfig.observabilityDashboard}'
      register: obs_flag
      changed_when: false
      failed_when: obs_flag.stdout | trim != 'true'

    - name: "M6 | User workload monitoring Prometheus pods are running"
      # The UWM Prometheus stack deploys asynchronously once the observability
      # chart's cluster-monitoring-config lands (enableUserWorkload: true) —
      # on this nightly the namespace exists empty until then.
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ uwm_namespace }}"
      register: uwm_pods
      until: >-
        uwm_pods.resources | length > 0 and
        uwm_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
      retries: 20
      delay: 15

    - name: "M6 | Model server pods are running as the metrics scrape target"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ project_name }}"
      register: model_pods
      failed_when: >-
        model_pods.resources | length == 0 or
        model_pods.resources
        | selectattr('metadata.name', 'match', '^' ~ model_name)
        | selectattr('status.phase', 'equalto', 'Running') | list | length == 0

    - name: "M6 | VERIFY — vLLM series are queryable in UWM Prometheus (federate)"
      # The UWM Prometheus query API is not exposed (9091/9092 are
      # kube-rbac-proxy ports allowing only /metrics and /federate) — the
      # /federate endpoint with a series match is the query path. Port-forward
      # the service and fetch the vLLM series for the student namespace; the
      # M4 request loop guarantees the scrape target has traffic.
      ansible.builtin.shell: |
        oc port-forward -n openshift-user-workload-monitoring \
          svc/prometheus-user-workload 19092:9092 > /dev/null 2>&1 &
        PF_PID=$!
        sleep 4
        curl -sSk -G -H "Authorization: Bearer $(oc whoami -t)" \
          'https://localhost:19092/federate' \
          --data-urlencode 'match[]={__name__=~"vllm:.*",namespace="{{ project_name }}"}' \
          | grep -c '^vllm:'
        RC=$?
        kill $PF_PID 2>/dev/null
        exit $RC
      register: m6_federate
      until: m6_federate.rc == 0 and (m6_federate.stdout | trim | int) > 0
      retries: 10
      delay: 15
      changed_when: false

    # ========================================================================
    # FINAL — Summary
    # ========================================================================

    - name: "E2E complete"
      ansible.builtin.debug:
        msg: >-
          Preflight + Modules 1-6 executed and verified successfully:
          platform signals converged, model serving endpoint, EvalHub
          benchmark evaluation (CLI + config-file runs, MLflow tracked),
          MaaS gateway inference (maas-free-subscription tier), Kueue quota
          gating, application request loop, metrics scrape + credential-
          failure negative test, and observability pipelines are all healthy.
          The dashboard-only steps (wizard, dashboard evaluation form, Gen AI
          studio views, Dev Spaces editor) are covered by the manual
          checklists in qa/runs/redhat-ai-inference/.
